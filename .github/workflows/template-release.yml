name: Template Release

on:
  push:
    tags:
      - "template-v*"

permissions:
  contents: write

jobs:
  publish-template-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm template:release:build --version=${GITHUB_REF_NAME#template-v}
        shell: bash
      - run: TEMPLATE_RELEASE_VALIDATE_MODE=${TEMPLATE_RELEASE_VALIDATE_MODE} TEMPLATE_VERSION=${GITHUB_REF_NAME#template-v} pnpm validate:template-release
        shell: bash
        env:
          TEMPLATE_RELEASE_VALIDATE_MODE: ${{ contains(github.ref_name, '-') && 'quick' || 'full' }}
      - run: pnpm template:release:publish --version=${GITHUB_REF_NAME#template-v}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TSU_TEMPLATE_REPOSITORY: zhengzebiao/tsu
